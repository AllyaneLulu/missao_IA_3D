<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz - Vestibular e Profissão</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="caixa-principal">

        <h1>🎓 Vestibular e Profissão</h1>

        <p class="subtitulo">
            Responda às perguntas e descubra mais sobre seus interesses
            e seu futuro profissional!
        </p>

        <!-- ÁREA DAS PERGUNTAS -->
        <div class="caixa-perguntas">
            A pergunta aparecerá aqui.
        </div>

        <!-- ÁREA DAS RESPOSTAS -->
        <div class="caixa-alternativas">
            <!-- Os botões serão criados automaticamente pelo JavaScript -->
        </div>

        <!-- ÁREA DO RESULTADO -->
        <div class="caixa-resultado">

            <h2>🎯 Resultado</h2>

            <p class="texto-resultado">
                Seu resultado aparecerá aqui.
            </p>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
